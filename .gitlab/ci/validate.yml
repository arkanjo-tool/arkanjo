citation:
  stage: validate
  image: python:3.11-slim

  before_script:
    - pip install --no-cache-dir cffconvert

  script:
    - cffconvert --validate

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\[WIP\]|Draft:|WIP:)/i'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - CITATION.cff
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - CITATION.cff
