stages:
  - build
  - test
  - documentation
  - deploy

variables:
  PYTHON_VERSION: '3.11'
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  INSTALL_PREFIX: "$CI_PROJECT_DIR/install"

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

.code-paths: &code-paths
  - 'cmake/**/*'
  - 'include/**/*'
  - 'requirements/**/*'
  - 'scripts/**/*'
  - 'src/**/*'
  - 'tests/**/*'
  - 'third-party/**/*'
  - '.gitlab-ci.yml'
  - 'CMakeLists.txt'
  - 'config.json'

.docs-paths: &docs-paths
  - 'cmake/**/*'
  - 'include/**/*'
  - 'src/**/*'
  - 'docs/**/*'
  - 'scripts/**/*'
  - 'CMakeLists.txt'
  - 'Doxyfile'
  - '.gitlab-ci.yml'
  - 'CONTRIBUTING.md'
  - 'MAINTAINERS.md'
  - 'README.md'

# - main branch             -> always runs automatically
# - Draft MR                -> MANUAL and optional
# - MR with code changes    -> runs automatically
# - MR without code changes -> MANUAL and optional
.rules-code: &rules-code
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\[WIP\]|Draft:|WIP:)/i'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *code-paths
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true

# - main branch                 -> always runs automatically
# - Draft MR                    -> MANUAL and optional
# - MR with relevant changes    -> runs automatically
# - MR without relevant changes -> MANUAL and optional
.rules-docs: &rules-docs
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\[WIP\]|Draft:|WIP:)/i'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *docs-paths
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true

.saas-runners:
  parallel:
    matrix:
      - OS: linux
        BUILD_TYPE: Release
        RUNNER_TAG: hipo-docker
        IMAGE: ubuntu:24.04

      # Tier GitLab: Premium, Ultimate
      # - OS: macos
      #   BUILD_TYPE: Release
      #   RUNNER_TAG: saas-macos-medium-m1
      #   IMAGE: macos-15-xcode-16

  tags:
    - ${RUNNER_TAG}

  image: ${IMAGE}

.linux-dependencies:
  before_script:
    - |
      if [ "$OS" = "linux" ]; then
        apt-get update
        apt-get install -y build-essential cmake git libicu-dev
      fi

.python-environment:
  before_script:
    - |
      if [ "$OS" = "linux" ]; then
        apt-get update
        apt-get install -y python3 python3-venv
      fi
    - python3 -m venv venv
    - export PATH="$CI_PROJECT_DIR/venv/bin:$PATH"
    - python -m pip install --upgrade pip
  cache:
    paths:
      - ${PIP_CACHE_DIR}

build:
  stage: build

  extends:
    - .saas-runners
    - .linux-dependencies

  <<: *rules-code

  script:
    # Configure CMake
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DCMAKE_INSTALL_PREFIX=${INSTALL_PREFIX}

    # Build
    - cmake --build build --config ${BUILD_TYPE} --target install
  artifacts:
    name: "arkanjo-cli-${OS}"
    paths:
      - install/
      - build/arkanjo-test
    expire_in: 1 hour

test:
  stage: test

  needs:
    - job: build
      artifacts: true
      parallel:
        matrix:
          - OS: ['$[[ matrix.OS ]]']
            BUILD_TYPE: ['$[[ matrix.BUILD_TYPE ]]']
            RUNNER_TAG: ['$[[ matrix.RUNNER_TAG ]]']
            IMAGE: ['$[[ matrix.IMAGE ]]']

  extends:
    - .saas-runners
    - .linux-dependencies
    - .python-environment

  <<: *rules-code

  script:
    - export PATH="$CI_PROJECT_DIR/install/bin:$CI_PROJECT_DIR/venv/bin:$PATH"

    # Install Python dependencies
    - python -m pip install -r requirements/tfidf.txt
    - python -m nltk.downloader punkt punkt_tab

    # Run C++ E2E tests
    - ./build/arkanjo-test

    # Run CLI integration tests
    - echo -e "tests/e2e/codebase\n0.9\n1" | arkanjo preprocessor build
    - arkanjo explorer
    - arkanjo duplication

documentation:
  stage: documentation

  tags:
    - hipo-docker

  image: ubuntu:24.04

  needs:
    - job: test
      artifacts: false

  <<: *rules-docs

  before_script:
    - apt-get update
    - apt-get install -y build-essential cmake graphviz git wget

  script:
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
    - DOXYGEN_VERSION=$(cmake -LA -N build | grep '^DOXYGEN_VERSION:' | cut -d= -f2)
    - DOXYGEN_SHA256=$(cmake -LA -N build | grep '^DOXYGEN_SHA256:' | cut -d= -f2)
    - ./scripts/install-doxygen.sh "$DOXYGEN_VERSION" "$DOXYGEN_SHA256"
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
    - cmake --build build --target doc

  artifacts:
    name: arkanjo-documentation
    paths:
      - docs/doxygen/html
    expire_in: 1 hour

pages:
  stage: deploy

  needs:
    - job: documentation
      artifacts: true

  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

  script:
    - mkdir -p public
    - cp -r docs/doxygen/html/* public/

  pages: true

  artifacts:
    paths:
      - public
    expire_in: 1 hour

validate-citation:
  stage: test
  image: python:3.11-slim

  before_script:
    - pip install --no-cache-dir cffconvert

  script:
    - cffconvert --validate

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\[WIP\]|Draft:|WIP:)/i'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - CITATION.cff
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - CITATION.cff
