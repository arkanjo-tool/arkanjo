stages:
  - build
  - test
  - documentation
  - deploy

variables:
  PYTHON_VERSION: '3.11'
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  INSTALL_PREFIX: "$CI_PROJECT_DIR/install"

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

.code-paths: &code-paths
  - 'cmake/**/*'
  - 'include/**/*'
  - 'requirements/**/*'
  - 'scripts/**/*'
  - 'src/**/*'
  - 'tests/**/*'
  - 'third-party/**/*'
  - '.gitlab-ci.yml'
  - 'CMakeLists.txt'
  - 'config.json'

.docs-paths: &docs-paths
  - 'cmake/**/*'
  - 'include/**/*'
  - 'src/**/*'
  - 'docs/**/*'
  - 'scripts/**/*'
  - 'CMakeLists.txt'
  - 'Doxyfile'
  - '.gitlab-ci.yml'
  - 'CONTRIBUTING.md'
  - 'MAINTAINERS.md'
  - 'README.md'

# - main branch             -> always runs automatically
# - Draft MR                -> MANUAL and optional
# - MR with code changes    -> runs automatically
# - MR without code changes -> MANUAL and optional
.rules-code:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\[WIP\]|Draft:|WIP:)/i'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *code-paths
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true

# - main branch                 -> always runs automatically
# - Draft MR                    -> MANUAL and optional
# - MR with relevant changes    -> runs automatically
# - MR without relevant changes -> MANUAL and optional
.rules-docs:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\[WIP\]|Draft:|WIP:)/i'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *docs-paths
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true

.saas-runners:
  parallel:
    matrix:
      - OS: linux
        BUILD_TYPE: Release
        RUNNER_TAG: hipo-docker
        IMAGE: ubuntu:24.04

      # Tier GitLab: Premium, Ultimate
      # - OS: macos
      #   BUILD_TYPE: Release
      #   RUNNER_TAG: saas-macos-medium-m1
      #   IMAGE: macos-15-xcode-16

  tags:
    - ${RUNNER_TAG}

  image: ${IMAGE}

.linux-dependencies:
  before_script:
    - |
      if [ "$OS" = "linux" ]; then
        apt-get update
        apt-get install -y build-essential cmake git libicu-dev
      fi

.python-environment:
  before_script:
    - |
      if [ "$OS" = "linux" ]; then
        apt-get update
        apt-get install -y python3 python3-venv
      fi
    - python3 -m venv venv
    - export PATH="$CI_PROJECT_DIR/venv/bin:$PATH"
    - python -m pip install --upgrade pip
  cache:
    paths:
      - ${PIP_CACHE_DIR}

include:
  - local: .gitlab/ci/build.yml
  - local: .gitlab/ci/test.yml
  - local: .gitlab/ci/documentation.yml
  - local: .gitlab/ci/deploy.yml
